<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵喵助手 - 全能版</title><标题>喵喵助手 - 全能版</标题>
    <style>
        body { font-family: sans-serif; background-color: #fdfaf3; color: #333; margin: 0; padding: 20px; padding-bottom: 60px; }主体 { 字体族: 无衬线字体; 背景颜色: #fdfaf3;颜色: #333; 外边距: 0; 内边距: 20像素; 底部内边距: 60像素; }
        .container { max-width: 500px; margin: 0 auto; }        .容器 { 最大宽度: 500像素; 外边距: 0 自动; }
        .title { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 10px; }        .标题 { 文本对齐: 居中; 字体大小: 24像素; 字体粗细: 加粗; 下边距: 10像素; }
        .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .section-title { font-weight: bold; margin-bottom: 10px; }
        .status-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; margin-right: 8px; }
        .status-running { color: #00b578; font-weight: bold; background: #e6f9f0; padding: 10px; border-radius: 20px; text-align: center; margin-top: 10px; }
        .mode-btn { border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 10px; cursor: pointer; }
        .mode-btn.active { border-color: #ff7e3d; background: #fff7f3; }
        .mode-btn.active::after { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ff7e3d; float: right; }
        .persona-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .persona-btn { background: #f0f0f0; border: none; border-radius: 8px; padding: 10px; cursor: pointer; }
        .persona-btn.active { background: #ff7e3d; color: #fff; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .toggle-switch { width: 40px; height: 20px; background: #ddd; border-radius: 20px; position: relative; cursor: pointer; }
        .toggle-switch.on { background: #ffb4a2; }
        .toggle-switch::after { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
        .toggle-switch.on::after { left: 22px; }
        textarea { width: 100%; height: 80px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 14px; resize: none; }
        .btn-primary { width: 100%; background: #00b578; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .sim-box { padding: 10px; border: 1px dashed #ccc; border-radius: 8px; margin-top: 10px; }
        .output-text { color: #00b578; font-weight: bold; margin-top: 10px; }
        
        /* 针对WebView原生的适配说明 */
        .native-tip { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🐱 喵喵助手 (全能整合版)</div>
        <div class="subtitle">文本改写 · 断句加成 · 颜文字</div>

        <!-- 跳转无障碍按钮 -->
        <button class="btn-primary" onclick="openAccessibility()">开启无障碍服务 (跳转)</button>

        <div class="status-card">
            <div><span class="status-dot" id="dot"></span><span id="status-text">未开启</span></div>
            <div>控制面板</div>
        </div>
        <div class="status-running">前端逻辑模拟运行中</div>

        <div class="card">
            <div class="section-title">处理模式</div>
            <div class="mode-btn active" onclick="setMode('punc')">标点触发 <br><small>打字时在标点处立即处理</small></div>
            <div class="mode-btn" onclick="setMode('real')">实时处理 <br><small>每输入一个字立即处理</small></div>
        </div>

        <div class="card">
            <div class="section-title">人格尾巴</div>
            <div class="persona-grid" id="personaGrid"></div>
        </div>

        <div class="card">
            <div class="section-title">功能开关</div>
            <div class="toggle-row" onclick="toggleSwitch(this)">句末颜文字 <div class="toggle-switch on"></div></div>
            <div class="toggle-row" onclick="toggleSwitch(this)">表情附加词 <div class="toggle-switch on"></div></div>
        </div>

        <div class="card">
            <div class="section-title">文本替换规则 (每行一个: 原词=替换词)</div>
            <textarea id="rules">我=本喵
你=大人
哥哥=大人
乐乐=杂鱼
傻逼=杂鱼</textarea>
            <div style="display:flex; justify-content: flex-end; margin-top:10px;">
                <button onclick="saveConfig()" style="background:#ff7e3d; color:white; border:none; padding:8px 15px; border-radius:5px;">保存配置</button>
            </div>
        </div>

        <!-- 模拟预览框 -->
        <div class="card">
            <div class="section-title">模拟输入框 (预览效果)</div>
            <textarea id="inputBox" placeholder="在这里打字测试 (例如：我哥哥在吗？)"></textarea>
            <div class="output-text">输出：<span id="outputSpan"></span></div>
        </div>

        <div class="native-tip">
            <b>如何实现真机无障碍（打包App时）：</b><br>
            1. 将下方注释里的原生代码复制到你的 Android 工程中。<br>
            2. 点击上方按钮时，HTML 会尝试通过 <code>window.MyNativeBridge.openAccessibilitySettings()</code> 调用原生代码。
        </div>
    </div>

    <!-- 核心前端逻辑 -->
    <script>
        const personas = {
            "默认": "", "软萌": "(蹭蹭)", "傲娇": "(哼!)", "高冷": "(冷漠)", 
            "撒娇": "(喵呜~)", "元气": "(>_<)", "病娇": "(嘿嘿)", "腹黑": "(微笑)"
        };
        let currentPersona = "默认";
        let currentMode = "punc";
        let isNativeActive = false;

        // 初始化界面
        const grid = document.getElementById('personaGrid');
        for (let p in personas) {
            const btn = document.createElement('button');
            btn.className = 'persona-btn' + (p === currentPersona ? ' active' : '');
            btn.innerText = p;
            btn.onclick = () => {
                currentPersona = p;
                document.querySelectorAll('.persona-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                processText();
                saveConfig();
            };
            grid.appendChild(btn);
        }

        // 切换模式
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            processText();
            saveConfig();
        }

        // 切换开关
        function toggleSwitch(el) {
            const sw = el.querySelector('.toggle-switch');
            sw.classList.toggle('on');
            saveConfig();
        }

        // 跳转无障碍并检查状态
        function openAccessibility() {
            // 尝试调用原生代码 (Android端)
            if (window.MyNativeBridge && window.MyNativeBridge.openAccessibilitySettings) {
                window.MyNativeBridge.openAccessibilitySettings();
                alert("已尝试拉起安卓无障碍设置页面，请在系统设置中开启本服务。");
            } else {
                alert("当前运行环境非支持原生的 WebView 环境。\n（普通浏览器无法跳转系统设置，若已打包为App请确认已配置JavascriptInterface）");
            }
        }

        // 保存配置到本地存储 (WebView 中也会生效)
        function saveConfig() {
            const config = {
                persona: currentPersona,
                mode: currentMode,
                rules: document.getElementById('rules').value,
                tailToggle: document.querySelector('.toggle-row .toggle-switch').classList.contains('on')
            };
            localStorage.setItem('maomaoConfig', JSON.stringify(config));
            
            if (window.MyNativeBridge && window.MyNativeBridge.saveRules) {
                window.MyNativeBridge.saveRules(JSON.stringify(config));
            }
        }

        // 监听输入
        document.getElementById('inputBox').addEventListener('input', processText);
        document.getElementById('rules').addEventListener('input', processText);

        // 核心处理函数
        function processText() {
            let text = document.getElementById('inputBox').value;
            
            // 读取替换规则
            const rulesText = document.getElementById('rules').value;
            const rules = rulesText.split('\n');
            for (let r of rules) {
                if (r.includes('=')) {
                    const [original, replacement] = r.split('=');
                    text = text.split(original.trim()).join(replacement.trim());
                }
            }

            // 判断是否加尾巴
            let shouldAddTail = document.querySelector('.toggle-row .toggle-switch').classList.contains('on');
            if (shouldAddTail && currentPersona !== "默认") {
                if (currentMode === 'real') {
                    text += " " + currentPersona;
                } else if (currentMode === 'punc') {
                    const lastChar = text.charAt(text.length - 1);
                    if (/[。！？!?.,，;；]/.test(lastChar)) {
                        text += " " + currentPersona;
                    }
                }
            }

            document.getElementById('outputSpan').innerText = text;
        }

        // 页面加载时读取配置
        window.onload = () => {
            const saved = localStorage.getItem('maomaoConfig');
            if (saved) {
                const config = JSON.parse(saved);
                currentPersona = config.persona;
                currentMode = config.mode;
                document.getElementById('rules').value = config.rules;
                // 更新UI状态...
                processText();
            }
        }
    </script>

    【1. MainActivity.java 添加 JS 接口】
    
    webView.addJavascriptInterface(new JavaScriptInterface(this), "MyNativeBridge");

    public class JavaScriptInterface {
        private Context context;
        public JavaScriptInterface(Context context) { this.context = context; }

        @JavascriptInterface
        public void openAccessibilitySettings() {
            Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            context.startActivity(intent);
        }

        @JavascriptInterface
        public void saveRules(String jsonRules) {
            SharedPreferences sp = context.getSharedPreferences("MaoMaoConfig", Context.MODE_PRIVATE);
            sp.edit().putString("rules", jsonRules).apply();
        }
    }

                node.performAction(AccessibilityNodeInfo.ACTION_PASTE);
            }

</html>
